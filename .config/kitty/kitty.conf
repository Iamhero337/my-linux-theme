#  ◈ KITTY TERMINAL CONFIGURATION (Sleek Dark Theme)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Typography ──
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.5
disable_ligatures never

# ── Window Styling & Glassmorphic Transparency ──
background_opacity         0.88
background_blur            32
hide_window_decorations    yes
window_padding_width       14 18
confirm_os_window_close    0
remember_window_size       yes
initial_window_width       950
initial_window_height      580

# ── Cursor & Interaction ──
cursor_shape               beam
cursor_blink_interval      0.5
cursor_stop_blinking_after 15.0
mouse_hide_wait            3.0
url_style                  curly
open_url_with              default
detect_urls                yes
copy_on_select             yes

# ── Scrollback & Performance ──
scrollback_lines           5000
wheel_scroll_multiplier    3.0
repaint_delay              10
input_delay                3
sync_to_monitor            yes
enable_audio_bell          no

# ── Tab Bar Styling ──
tab_bar_edge               top
tab_bar_style              powerline
tab_powerline_style        slanted
active_tab_font_style      bold
inactive_tab_font_style    normal

# ── Color Palette (Material Dark + Fallback) ──
include ~/.config/kitty/colors-matugen.conf
