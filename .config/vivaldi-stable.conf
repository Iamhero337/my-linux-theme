# ============================================
# VIVALDI PERFORMANCE & WAYLAND OPTIMIZATIONS
# ============================================

# --- WAYLAND, DESKTOP INTEGRATION & KEYRING ---
--ozone-platform=wayland
--password-store=gnome-libsecret
--enable-wayland-ime

# --- GPU ACCELERATION (Intel iGPU + NVIDIA dGPU) ---
--enable-gpu-compositing
--enable-gpu-rasterization
--enable-zero-copy
--enable-native-gpu-memory-buffers
--enable-oop-rasterization
--enable-raw-draw
--ignore-gpu-blocklist
--disable-gpu-driver-bug-workarounds

# --- VIDEO HARDWARE ACCELERATION (VA-API) ---
--enable-accelerated-video-decode
--enable-accelerated-video-encode
--enable-accelerated-mjpeg-decode

# --- MEMORY, TILES & CACHE ---
--renderer-process-limit=4
--max-tiles-for-interest-area=512
--default-tile-width=512
--default-tile-height=512
--memory-pressure-off

# --- STARTUP SPEED ---
--no-first-run
--no-default-browser-check
--disable-background-networking
--disable-background-timer-throttling
--disable-renderer-backgrounding
--disable-ipc-flooding-protection
--disable-sync-preferences
--disable-component-update
--disable-default-apps

# --- NETWORK OPTIMIZATION ---
--enable-quic

# --- FONTS & DISPLAY ---
--force-color-profile=srgb
--enable-font-antialiasing
--enable-subpixel-font-rendering

# --- CONSOLIDATED FEATURES (Unified declaration to prevent Chromium flag overwrite) ---
--enable-features=VaapiVideoDecoder,VaapiVideoEncoder,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder,VaapiIgnoreDriverChecks,CanvasOopRasterization,UseSkiaRenderer,SkiaGraphite,WaylandColorManagementV1,UseHDRTransferFunction,BackForwardCache,MemoryPressureHandler,TabFreezing,TabDiscarding,HighEfficiencyModeAvailable,LazyFrameLoading,DeferRendererTimeout,NetworkServiceInProcess,ParallelDownloading,TCPFastOpen,DnsOverHttpsUpgrade,FontSrcLocalMatching

# --- CONSOLIDATED DISABLED FEATURES ---
--disable-features=AudioServiceOutOfProcess,NetworkPrediction,HardwareMediaKeyHandling,GlobalMediaControls,GlobalMediaControlsCastStartStop,Translate,AutofillServerCommunication,PasswordLeakDetection
