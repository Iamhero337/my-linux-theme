# ============================================
# VIVALDI PERFORMANCE OPTIMIZATIONS - UPDATED
# Vivaldi 8.1+ on KDE Plasma 6 / Wayland
# ============================================

# --- WAYLAND, DESKTOP INTEGRATION & KEYRING ---
--ozone-platform=wayland
--password-store=gnome-libsecret
--use-gl=egl
--enable-features=WaylandColorManagementV1,UseHDRTransferFunction,UseSkiaRenderer,SkiaGraphite,CanvasOopRasterization
--enable-wayland-ime

# --- GPU ACCELERATION (Intel iGPU + NVIDIA dGPU) ---
--enable-gpu-compositing
--enable-gpu-rasterization
--enable-zero-copy
--enable-native-gpu-memory-buffers
--enable-oop-rasterization
--canvas-oop-rasterization
--enable-raw-draw
--use-vulkan
--enable-vulkan
--enable-skia-graphite
--ignore-gpu-blocklist
--disable-gpu-driver-bug-workarounds

# --- VIDEO HARDWARE ACCELERATION (VA-API) ---
--enable-accelerated-video-decode
--enable-accelerated-video-encode
--enable-accelerated-mjpeg-decode
--enable-features=VaapiVideoDecoder,VaapiVideoEncoder,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder,VaapiIgnoreDriverChecks,VaapiOnNvidiaGPUs

# --- MEMORY & PERFORMANCE ---
--enable-features=BackForwardCache,MemoryPressureHandler,TabFreezing,HighEfficiencyModeAvailable
--renderer-process-limit=4
--max-tiles-for-interest-area=512
--default-tile-width=512
--default-tile-height=512
--enable-features=LazyFrameLoading,DeferRendererTimeout

# --- STARTUP SPEED ---
--no-first-run
--no-default-browser-check
--disable-background-networking
--disable-background-timer-throttling
--disable-renderer-backgrounding
--disable-ipc-flooding-protection

# --- NETWORK OPTIMIZATION ---
--enable-features=NetworkServiceInProcess,ParallelDownloading,TCPFastOpen
--enable-quic
--enable-features=DnsOverHttpsUpgrade

# --- REDUCE RESOURCE USAGE ---
--disable-features=AudioServiceOutOfProcess,NetworkPrediction,HardwareMediaKeyHandling,GlobalMediaControls,GlobalMediaControlsCastStartStop
--enable-features=TabDiscarding,TabFreezing,BackForwardCache
--memory-pressure-off

# --- FONTS & RENDERING ---
--enable-features=FontSrcLocalMatching,CanvasOopRasterization
--force-color-profile=srgb
--enable-font-antialiasing
--enable-subpixel-font-rendering

# --- DISABLE UNNEEDED ---
--disable-features=Translate,AutofillServerCommunication,PasswordLeakDetection
--disable-sync-preferences
--disable-component-update
--disable-default-apps
