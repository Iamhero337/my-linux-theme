# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ KEYBINDINGS (Ultra-Responsive & Standardized)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

$mainMod = SUPER

# ── Mouse ──
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── Window Navigation & Management ──
bind = $mainMod, Q, killactive
bind = ALT, F4, killactive
bind = SUPER SHIFT, F, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, G, togglegroup
bind = $mainMod, Tab, changegroupactive, f
bind = SUPER SHIFT, Tab, changegroupactive, b
bind = $mainMod, S, layoutmsg, togglesplit

# Focus navigation (Arrow keys + Vim keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move active window
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d

# Resize active window
binde = SUPER CTRL, left, resizeactive, -50 0
binde = SUPER CTRL, right, resizeactive, 50 0
binde = SUPER CTRL, up, resizeactive, 0 -50
binde = SUPER CTRL, down, resizeactive, 0 50

# ── Applications & Launchers ──
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Space, exec, ~/.config/hypr/scripts/qs_manager.sh toggle applauncher
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, E, exec, dolphin
bind = $mainMod, B, exec, vivaldi
bind = $mainMod, T, exec, telegram-desktop || Telegram
bind = $mainMod, W, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle wallpaper
bind = $mainMod, V, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle clipboard

# ── Quickshell Popups & Overlays ──
bind = SUPER SHIFT, S, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle settings
bind = SUPER SHIFT, Q, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle music
bind = SUPER SHIFT, M, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle monitors
bind = SUPER SHIFT, V, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle volume
bind = SUPER SHIFT, N, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle network
bind = SUPER SHIFT, C, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle calendar
bind = SUPER SHIFT, G, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle gpu
bind = $mainMod, P, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle monitors
bind = SUPER SHIFT, P, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle monitors
bind = SUPER SHIFT, B, exec, bash ~/.config/waybar/scripts/toggle.sh
bind = $mainMod, R, exec, bash ~/.config/hypr/scripts/reload.sh

# ── System, Lock & Power ──
bind = $mainMod, M, exec, bash ~/.config/hypr/scripts/exit.sh
bind = SUPER SHIFT, L, exec, bash ~/.config/hypr/scripts/lock.sh
bindl = , XF86PowerOff, exec, bash ~/.config/hypr/scripts/lock.sh

# ── Screenshots ──
bindl = , Print, exec, ~/.config/hypr/scripts/screenshot.sh --full
bindl = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh
bindl = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh --edit
bindl = SUPER SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh --full --edit

# ── Hardware Keys (Audio, Brightness, Media) ──
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# ── Workspaces (Instant Native Switching) ──
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ── Shortcut Manager ──
bind = $mainMod, slash, exec, python3 /home/hero/.local/share/hypr-shortcuts/shortcut_manager.py



