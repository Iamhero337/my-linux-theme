exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_THEME XCURSOR_THEME XCURSOR_SIZE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_THEME XCURSOR_THEME XCURSOR_SIZE
exec-once = /usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1
exec-once = swww-daemon
exec-once = hypridle
exec-once = playerctld
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = command -v easyeffects >/dev/null 2>&1 && systemctl --user enable --now easyeffects
exec-once = ~/.config/hypr/scripts/volume_listener.sh
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Classic'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/Shell.qml
exec-once = python3 ~/.config/hypr/scripts/quickshell/focustime/focus_daemon.py &
exec-once = kdeconnect-indicator &
exec-once = xsettingsd &
exec-once = python3 ~/.config/hypr/scripts/gesture_daemon.py &
