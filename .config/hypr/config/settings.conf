#  ◈ SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    border_size = 2
    gaps_in = 4
    gaps_out = 4
    float_gaps = 6
    resize_on_border = true
    extend_border_grab_area = 30
    hover_icon_on_border = true
    col.active_border = $active_border
    col.inactive_border = $inactive_border
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.98
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }
    shadow {
        enabled = false
    }
}

input {
    kb_layout = us, ru
    kb_options = grp:alt_shift_toggle
    kb_variant = 
    kb_model = 
    kb_rules = 
    accel_profile = flat

    touchpad {
        natural_scroll = true
    }
}

misc {
    focus_on_activate = true
    font_family = JetBrains Mono
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}

render {
    direct_scanout = true
}

animations {
    enabled = yes
    bezier = quickPop, 0.16, 1, 0.3, 1
    bezier = fastDecel, 0.05, 0.9, 0.1, 1.0
    bezier = snappyExit, 0.2, 0, 0, 1

    animation = windows, 1, 3.2, quickPop, popin 88%
    animation = windowsOut, 1, 1.8, snappyExit, popin 90%
    animation = layers, 1, 3.0, quickPop
    animation = layersIn, 1, 2.6, quickPop, fade
    animation = layersOut, 1, 1.6, snappyExit, fade
    animation = fade, 1, 1.8, fastDecel
    animation = workspaces, 1, 2.6, fastDecel, slide
    animation = specialWorkspaceIn, 1, 2.6, quickPop, fade
    animation = specialWorkspaceOut, 1, 1.8, snappyExit, fade
}

cursor {
    no_hardware_cursors = false
    enable_hyprcursor = true
    sync_gsettings_theme = true
}

gesture = 4, horizontal, workspace


